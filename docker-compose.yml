# PostgreSQL for local development.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sealed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SealedTr4nsfer_2026}
      POSTGRES_DB: sealedtransfer
    ports:
      # Bound to localhost so the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
